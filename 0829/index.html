<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Who loves you the most? 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     🎨 樣式設定 (視覺風格)
     一般不需要修改這裡，除非你想調整顏色或字型
     ============================================================ */
  :root{
    --cream:#FFF7F1;
    --blush:#FFDCE8;
    --blush-deep:#FFC2D6;
    --lavender:#E7DCFF;
    --rose:#FF6F91;
    --rose-deep:#E84C7D;
    --plum:#4A2A4A;
    --gold:#FFC857;
    --white:#FFFFFF;
    --font-display: 'Fredoka', system-ui, sans-serif;
    --font-body: 'Quicksand', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:var(--font-body);
    background:var(--cream);
    color:var(--plum);
    touch-action:manipulation;
  }
  #app{ position:fixed; inset:0; overflow:hidden; }

  .screen{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    /* 如果內容比螢幕高，優先靠上對齊 (safe center)，
       這樣最上面的元素（例如生日小遊戲的小標籤）才不會被擠出畫面外、被裁掉。
       瀏覽器不支援 safe 關鍵字的話，會直接忽略這兩行，退回原本的置中。 */
    align-items:safe center;
    justify-content:safe center;
    flex-direction:column;
    transition:opacity .5s ease;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  .hidden{ display:none !important; }
  .fading-out{ opacity:0; pointer-events:none; }

  /* ---------- 背景裝飾 (漂浮愛心/氣球) ---------- */
  .bg-deco{
    position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;
    background:
      radial-gradient(circle at 20% 20%, var(--blush) 0%, transparent 55%),
      radial-gradient(circle at 80% 30%, var(--lavender) 0%, transparent 55%),
      radial-gradient(circle at 50% 90%, var(--blush-deep) 0%, transparent 50%),
      var(--cream);
  }
  .deco-item{
    position:absolute;
    bottom:-60px;
    font-size:28px;
    opacity:.35;
    animation:driftUp linear infinite;
    user-select:none;
  }
  @keyframes driftUp{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    10%{ opacity:.35; }
    90%{ opacity:.35; }
    100%{ transform:translate(var(--dx,20px), -115vh) rotate(25deg); opacity:0; }
  }

  /* ---------- 開始畫面 ---------- */
  #start-screen{
    z-index:2;
    text-align:center;
    padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }
  /* 背景裝飾要在文字與開始按鈕後面，避免少數手機的堆疊順序造成無法點擊。 */
  #start-screen > :not(.bg-deco){ position:relative; z-index:1; }
  .eyebrow{
    font-family:var(--font-body);
    font-weight:700;
    letter-spacing:.08em;
    color:var(--rose-deep);
    background:var(--white);
    padding:6px 16px;
    border-radius:999px;
    font-size:13px;
    margin-bottom:18px;
    box-shadow:0 4px 14px rgba(232,76,125,.18);
  }
  .title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(30px, 8vw, 54px);
    line-height:1.25;
    color:var(--plum);
    max-width:680px;
    margin:0 0 8px;
    text-shadow:0 4px 0 rgba(255,255,255,.6);
  }
  .title .hl{ color:var(--rose-deep); }
  .subtitle{
    font-size:clamp(13px,3vw,16px);
    color:#7a5b73;
    margin-bottom:34px;
    font-weight:600;
  }
  #start-btn{
    font-family:var(--font-display);
    font-size:clamp(18px,4.5vw,22px);
    font-weight:600;
    color:var(--white);
    background:linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
    border:none;
    padding:16px 46px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(232,76,125,.4), inset 0 -3px 0 rgba(0,0,0,.08);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #start-btn:active{ transform:scale(.94); box-shadow:0 6px 14px rgba(232,76,125,.35); }
  @keyframes pulseBtn{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.045); }
  }
  #start-btn{ animation:pulseBtn 2.2s ease-in-out infinite; }

  /* ---------- 遊戲畫面 ---------- */
  #game-screen{ z-index:2; }
  #bubble-field{
    position:absolute; inset:0; overflow:hidden;
  }
  .bubble-wrap{
    position:absolute;
    top:-120px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:3;
  }
  .bubble{
    width:100%; height:100%;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-family:var(--font-display);
    font-weight:600;
    color:var(--plum);
    padding:6px;
    white-space:nowrap;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(74,42,74,.18), inset 0 -4px 10px rgba(255,255,255,.5), inset 0 4px 8px rgba(255,255,255,.35);
    border:2px solid rgba(255,255,255,.7);
    user-select:none;
  }
  .bubble-inner-wobble{
    animation:wobble 3.4s ease-in-out infinite;
  }
  @keyframes wobble{
    0%,100%{ transform:translateX(0) rotate(0deg); }
    50%{ transform:translateX(var(--wobble-dist,14px)) rotate(3deg); }
  }
  .bubble.remi-bubble{
    background:linear-gradient(150deg, #FFEFF4 0%, var(--blush-deep) 60%, var(--rose) 100%);
    color:var(--rose-deep);
    font-weight:700;
  }
  .bubble.remi-bubble.pulse{ animation: heartPulse .5s ease; }
  @keyframes heartPulse{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }
  .poof{ animation:poofPop .45s ease; }
  @keyframes poofPop{
    0%{ transform:scale(1); }
    40%{ transform:scale(.55) rotate(-8deg); opacity:.6; }
    70%{ transform:scale(1.15) rotate(6deg); opacity:1; }
    100%{ transform:scale(1) rotate(0); }
  }
  .sleepy-wobble{ animation:sleepyShake .45s ease; }
  @keyframes sleepyShake{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    25%{ transform:translateY(-4px) rotate(-4deg); }
    75%{ transform:translateY(4px) rotate(4deg); }
  }
  .pop-out{ animation:popOut .28s ease forwards; }
  @keyframes popOut{
    to{ transform:scale(0); opacity:0; }
  }

  /* ---------- 食物彩蛋 ---------- */
  .food-icon{
    position:absolute;
    font-size:40px;
    cursor:pointer;
    z-index:4;
    animation:foodBounce 1.8s ease-in-out infinite;
    filter:drop-shadow(0 6px 10px rgba(74,42,74,.25));
  }
  @keyframes foodBounce{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-14px) rotate(4deg); }
  }

  /* ---------- 彈出訊息卡 ---------- */
  #popup{
    position:absolute;
    left:50%; top:14%;
    transform:translate(-50%,-16px);
    background:var(--white);
    border-radius:22px;
    padding:18px 26px;
    text-align:center;
    box-shadow:0 14px 34px rgba(74,42,74,.22);
    z-index:10;
    min-width:220px;
    max-width:80vw;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  #popup.show{
    opacity:1;
    transform:translate(-50%,0);
  }
  .popup-name{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:700;
    color:var(--rose-deep);
  }
  .popup-percent{ color:var(--rose-deep); font-weight:700; }
  .popup-comment{
    margin-top:6px;
    font-size:15px;
    font-weight:600;
    color:#7a5b73;
  }

  /* ---------- 結局畫面 ---------- */
  #ending-screen{
    z-index:20;
  }
  #remi-fullscreen{
    position:absolute;
    left:50%; top:50%;
    width:60px; height:60px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFEFF4 0%, var(--blush-deep) 45%, var(--rose) 100%);
    transform:translate(-50%,-50%);
    /* 結局背景只平滑展開，不使用會超出目標尺寸的彈簧曲線。 */
    transition:width .55s ease-out, height .55s ease-out;
    box-shadow:0 0 80px rgba(255,111,145,.5);
  }
  #ending-text{
    position:relative; z-index:21;
    text-align:center;
    opacity:0;
    transition:opacity .6s ease;
  }
  #ending-text.show{ opacity:1; }
  .ending-line{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(22px,6vw,34px);
    color:var(--white);
    text-shadow:0 4px 14px rgba(0,0,0,.15);
    margin-bottom:26px;
    padding:0 20px;
  }
  #next-btn{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:600;
    color:var(--rose-deep);
    background:var(--white);
    border:none;
    padding:14px 40px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,.18);
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease, transform .5s ease;
  }
  #next-btn.show{ opacity:1; transform:translateY(0); }
  #restart-link{
    display:block;
    margin-top:16px;
    font-size:13px;
    color:rgba(255,255,255,.85);
    text-decoration:underline;
    cursor:pointer;
    opacity:0;
    transition:opacity .5s ease;
  }
  #restart-link.show{ opacity:1; }

  /* ================= 第 1.5 頁：紐西蘭回憶相簿 ================= */
  #photos-screen{ padding:28px 20px; text-align:center; }
  #photos-eyebrow{
    display:inline-block;
    background:var(--white);
    color:var(--rose-deep);
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    letter-spacing:.02em;
    padding:6px 16px;
    border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    margin-bottom:10px;
  }
  #photos-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(20px,6vw,28px);
    color:var(--plum);
    margin:0 0 4px;
    line-height:1.3;
  }
  #photos-subtitle{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    color:var(--rose-deep);
    margin:0 0 18px;
  }
  #photo-viewer{
    position:relative;
    width:min(88vw, 380px);
    aspect-ratio: 4 / 5;
    border-radius:22px;
    overflow:hidden;
    background:var(--white);
    box-shadow:0 18px 40px rgba(74,42,74,.22);
    margin:0 auto;
  }
  #photo-img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    opacity:1;
    transition:opacity .28s ease;
    background:var(--blush);
  }
  #photo-img.fading{ opacity:0; }
  .photo-tap-zone{
    position:absolute; top:0; bottom:0;
    width:50%;
    cursor:pointer;
    display:flex; align-items:center;
    background:transparent;
    border:none; padding:0;
  }
  #photo-prev-zone{ left:0; justify-content:flex-start; }
  #photo-next-zone{ right:0; justify-content:flex-end; }
  .photo-arrow{
    margin:0 10px;
    width:34px; height:34px;
    border-radius:50%;
    background:rgba(74,42,74,.38);
    color:var(--white);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .2s ease, transform .2s ease;
    opacity:0;
  }
  #photo-viewer:hover .photo-arrow,
  #photo-viewer:active .photo-arrow{ opacity:1; }
  .photo-tap-zone.disabled{ cursor:default; }
  .photo-tap-zone.disabled .photo-arrow{ opacity:0 !important; }
  #photo-counter{
    margin-top:12px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    color:var(--plum);
    opacity:.7;
  }
  #photo-caption{
    font-family:'Noto Serif TC', 'PMingLiU', serif;
    font-size:clamp(14px,4vw,16px);
    line-height:1.8;
    color:var(--plum);
    max-width:min(88vw, 380px);
    margin:14px auto 0;
    min-height:1.8em;
  }
  #photos-next-btn{
    margin-top:26px;
    font-family:var(--font-display);
    font-size:16px;
    font-weight:600;
    color:var(--white);
    background:linear-gradient(135deg, var(--rose), var(--rose-deep));
    border:none;
    padding:12px 34px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(232,76,125,.3);
  }


  .heart-particle{
    position:absolute;
    font-size:22px;
    z-index:22;
    pointer-events:none;
    animation:heartFloat 2.2s ease-out forwards;
  }
  @keyframes heartFloat{
    0%{ transform:translateY(0) scale(.6); opacity:1; }
    100%{ transform:translateY(-160px) scale(1.1); opacity:0; }
  }

  /* ================= Page 2: 10,957 DAYS ================= */

  :root{
    --sky-start:#B2EBEC;
    --sky-end:#FFDCB0;
    --accent:#FF7A62;
    --accent-deep:#E6543C;
    --ink:#204B4D;
    --ink-soft:#4E7A7D;
    --gold:#FFC857;
    --paper:#FFF8EC;
    --paper-edge:#F1E4CC;
    --white:#FFFFFF;
    --font-display:'Fredoka', system-ui, sans-serif;
    --font-body:'Quicksand', system-ui, sans-serif;
    --font-letter:'Noto Serif TC', 'PMingLiU', serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:var(--font-body);
    color:var(--ink);
    touch-action:manipulation;
    background:linear-gradient(180deg, var(--sky-start) 0%, var(--sky-end) 100%);
  }

  .glow{ position:absolute; border-radius:50%; pointer-events:none; filter:blur(40px); opacity:.5; }
  .glow-1{ width:260px; height:260px; left:-60px; top:-40px; background:var(--sky-start); }
  .glow-2{ width:300px; height:300px; right:-80px; bottom:-60px; background:var(--gold); opacity:.35; }

  #tap-hint{
    position:absolute; left:50%; bottom:9%;
    transform:translateX(-50%);
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    color:var(--ink-soft);
    letter-spacing:.04em;
    opacity:.85;
    animation:tapPulse 2.2s ease-in-out infinite;
    z-index:5;
    text-align:center;
    padding:0 20px;
  }
  @keyframes tapPulse{
    0%,100%{ opacity:.5; transform:translateX(-50%) translateY(0); }
    50%{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  }
  #tap-hint.hidden{ display:none; }

  #birth-date{
    position:absolute; left:50%; top:9%;
    transform:translateX(-50%);
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(16px,4.6vw,20px);
    letter-spacing:.06em;
    color:var(--ink-soft);
    opacity:0;
    transition:opacity 1s ease;
    z-index:4;
    text-align:center;
    white-space:nowrap;
  }
  #birth-date.show{ opacity:1; }
  #birth-date.fade-out{ opacity:0; transition:opacity .8s ease; }
  #birth-date.counting{ color:var(--ink); font-size:clamp(20px,5.6vw,26px); }

  #bottle-stage{
    position:absolute; left:50%; top:46%;
    transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center;
    z-index:2;
  }
  #days-label{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(20px,5.4vw,28px);
    letter-spacing:.06em;
    color:var(--ink);
    text-shadow:0 3px 0 rgba(255,255,255,.55);
    margin-bottom:6px;
    opacity:0;
    transition:opacity 1s ease;
  }
  #days-label.show{ opacity:1; }
  #days-label.fade-out{ opacity:0; transition:opacity .8s ease; }

  #bottle-wrap{ position:relative; width:min(58vw, 260px); aspect-ratio: 300 / 420; }
  #bottle-glass{ position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 18px 26px rgba(32,75,77,.18)); }
  #day-canvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    z-index:1; pointer-events:none;
    transition:opacity 1s ease;
  }
  #bottle-glass{ z-index:2; pointer-events:none; }
  #day-canvas.fade-out{ opacity:0; }

  #reveal-text{
    position:absolute; left:50%; top:46%;
    transform:translate(-50%,-50%);
    text-align:center; z-index:3; pointer-events:none;
  }
  #number-30{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(72px,22vw,128px);
    color:var(--accent-deep);
    text-shadow:0 6px 0 rgba(255,255,255,.5), 0 18px 30px rgba(230,84,60,.25);
    opacity:0;
    transform:scale(.6);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.22,1.4,.36,1);
  }
  #number-30.show{ opacity:1; transform:scale(1); }
  #congrats-text{
    margin-top:2px;
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(18px,5vw,24px);
    color:var(--ink);
    opacity:0;
    transform:translateY(10px);
    transition:opacity 1s ease, transform 1s ease;
  }
  #congrats-text.show{ opacity:1; transform:translateY(0); }

  #envelope-wrap{
    position:absolute; left:50%; bottom:9%;
    transform:translateX(-50%);
    text-align:center; z-index:6;
    opacity:0; pointer-events:none;
    transition:opacity 1s ease;
  }
  #envelope-wrap.show{ opacity:1; pointer-events:auto; }
  #envelope-btn{
    background:none; border:none; cursor:pointer;
    font-size:clamp(46px,13vw,60px);
    line-height:1; padding:14px;
    animation:envelopeFloat 2.6s ease-in-out infinite;
    filter:drop-shadow(0 8px 16px rgba(230,84,60,.25));
  }
  @keyframes envelopeFloat{
    0%,100%{ transform:translateY(0) rotate(-3deg); }
    50%{ transform:translateY(-10px) rotate(3deg); }
  }
  #envelope-btn.opening{ animation:none; }
  #envelope-hint{ font-family:var(--font-body); font-weight:600; font-size:14px; color:var(--ink-soft); letter-spacing:.03em; }

  #letter-overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(32,75,77,0);
    z-index:20; opacity:0; pointer-events:none;
    transition:opacity .6s ease, background-color .6s ease;
  }
  #letter-overlay.show{ opacity:1; pointer-events:auto; background:rgba(32,75,77,.28); }
  #letter-card{
    width:min(92vw, 460px);
    max-height:82vh;
    overflow-y:auto;
    background:var(--paper);
    border:1px solid var(--paper-edge);
    border-radius:18px;
    padding:34px 28px 40px;
    box-shadow:0 24px 60px rgba(32,75,77,.35);
    transform:scaleY(.15) translateY(10px);
    transform-origin:top center;
    opacity:0;
    transition:transform .6s cubic-bezier(.22,1,.36,1), opacity .5s ease;
    position:relative;
  }
  #letter-card.show{ transform:scaleY(1) translateY(0); opacity:1; }
  #letter-card::before{
    content:"";
    position:absolute; left:22px; right:22px; top:14px; bottom:14px;
    border:1px solid rgba(32,75,77,.08);
    border-radius:10px;
    pointer-events:none;
  }
  #letter-heart{ font-size:20px; text-align:center; margin-bottom:10px; opacity:.85; }
  #letter-lines{
    font-family:var(--font-letter);
    font-size:clamp(16px,4.2vw,19px);
    line-height:2.05;
    color:var(--ink);
    letter-spacing:.02em;
    text-align:center;
  }
  .letter-line{ opacity:0; transform:translateY(8px); transition:opacity 1s ease, transform 1s ease; }
  .letter-line.show{ opacity:1; transform:translateY(0); }
  .letter-line-final{ margin-top:18px; font-weight:600; color:var(--accent-deep); transition:opacity 1.6s ease, transform 1.6s ease; }

  #close-letter{
    display:block; margin:16px auto 0;
    background:none; border:1px solid rgba(32,75,77,.25);
    color:var(--ink-soft);
    font-family:var(--font-body);
    font-weight:600; font-size:13px;
    padding:8px 20px; border-radius:999px;
    cursor:pointer; opacity:0;
    transition:opacity 1s ease;
  }
  #close-letter.show{ opacity:1; }

  #restart-wrap{
    position:absolute; left:50%; bottom:2.5%;
    transform:translateX(-50%);
    z-index:6;
    opacity:0; pointer-events:none;
    transition:opacity 1s ease;
  }

<script>
/* ================================================================

                   "remi"        -> 真正的答案 (只有 Remi 使用，請勿新增第二個)
   ================================================================ */
const CHARACTERS = [
  { id:"princess",     name:"小公主",       loved:95, comment:"是你的工作好夥伴",                          special:null },
  { id:"engTeacher",   name:"英文老師",     loved:95, comment:"是你的好朋友",                              special:null },
  { id:"chnProf",      name:"中文教授",     loved:80, comment:"好像很少看你跟他聊天",                      special:null },
  { id:"civilGuy",     name:"土木的人",     loved:80, comment:"好像很少看你跟他聊天",                      special:null },
  { id:"nico",         name:"Nico",         loved:50, comment:"meow meow meow 🐱～",                        special:null, sound:"meow" },
  { id:"tux",          name:"Tux",          loved:50, comment:"meow meow meow 🐱～",                        special:"tux", sound:"meow" },
  { id:"mazzie",       name:"Mazzie",       loved:80, comment:"Zzzz 打鼻鼾 🐶",                             special:"sleepy" },
  { id:"bailey",       name:"Bailey",       loved:80, comment:"Zzzz 打鼻鼾 🐶",                             special:"sleepy" },
  { id:"sloane",       name:"Sloane",       loved:80, comment:"雖然英文名字唸法怪怪的，但他是個好人",       special:null },
  { id:"chocolate",    name:"Chocolate",    loved:25, comment:"有食物再來找我 🐹",                          special:"food", sound:"guinea" },
  { id:"marshmallow",  name:"Marshmallow",  loved:25, comment:"51515151 🐹",                                special:"food", sound:"guinea" },
  { id:"sam",          name:"Sam",          loved:0,  comment:"是38家的房東",                               special:null },
  { id:"shally",       name:"Shally",       loved:80, comment:"你的好室友",                                 special:null },
  { id:"mary",         name:"Mary",         loved:50, comment:"好笑的人",                                   special:null },
  { id:"hazel",        name:"Hazel",        loved:50, comment:"分開的時候有寫卡片給你",                     special:null },
  { id:"andrea",       name:"Andrea",       loved:80, comment:"感覺滿愛你的",                               special:null },
  { id:"rack",         name:"Rack",         loved:60, comment:"Andrea 的老公",                              special:null },
  { id:"doris",        name:"Doris",        loved:50, comment:"好像還好",                                   special:null },
  { id:"remi",         name:"Remi",         loved:null, comment:"",                                        special:"remi" },
];

/* ================================================================
   🎚️ 遊戲節奏 / 難度設定 — 想調整遊戲快慢可以改這裡
   ================================================================ */
const SETTINGS = {
  remiStartPercent: 10,      // Remi 一開始的 %
  remiIncrement: 10,         // 每點錯一個人，Remi 增加多少 %
  maxConcurrentBubbles: 20,   // 畫面上最多同時有幾個泡泡
  spawnIntervalMin: 850,     // 泡泡出現的最短間隔 (毫秒)
  spawnIntervalMax: 1600,    // 泡泡出現的最長間隔 (毫秒)
  bubbleSizeMin: 68,         // 一般泡泡最小尺寸 (px)
  bubbleSizeMax: 108,        // 一般泡泡最大尺寸 (px)
  bubbleSpeedMin: 42,        // 泡泡下降速度 最慢 (px/秒)
  bubbleSpeedMax: 85,        // 泡泡下降速度 最快 (px/秒)
  foodSpawnDelay: 14000,     // 遊戲開始後多久出現食物彩蛋 (毫秒)
  popupDuration: 1900,       // 人物訊息卡顯示多久 (毫秒)
};

/* ================================================================
   🔊 音效設定
   大部分音效 (點錯 / Tux逃跑 / 食物 / Remi變大 / 結局成功) 都是用
   瀏覽器的 Web Audio API「現場合成」出來的，不需要任何音檔。

   只有「貓叫聲」跟「狗打呼聲」這兩種動物聲音沒辦法合成得像，
   所以先用音檔佔位。之後想放真的喵喵聲/打呼聲，
   把音檔放進跟這個網頁同一層的 "sounds" 資料夾，檔名要跟下面完全一樣：
   ================================================================ */
const ANIMAL_SOUNDS = {
  meow:  "sounds/meow.mp3",   // Nico / Tux 的喵喵聲
  snore: "sounds/snore.mp3",  // Mazzie / Bailey 打呼聲
  guinea:"sounds/guinea.mp3", // Chocolate / Marshmallow 的天竺鼠叫聲
};

// ---------- 背景音樂：同一時間只保留一首，避免不同頁面的音樂重疊 ----------
const BGM = (function(){
  const tracks = {
    game:     { src:"Be a Fool v.mp3",               volume:.1 },
    memories: { src:"How Long Will I Love You v.mp3", volume:.4 },
    birthday: { src:"Happy Birthday Song.mp3",        volume:.3 },
  };
  const players = {};
  const gameDeck = [];
  let current = null;
  let gameActive = 0;

  function playerFor(name){
    if(!players[name]){
      const track = tracks[name];
      if(!track) return null;
      const audio = new Audio(track.src);
      audio.loop = true;
      audio.volume = track.volume;
      players[name] = audio;
    }
    return players[name];
  }

  function fadeTo(audio, targetVolume, duration, after){
    if(audio._bgmFade) clearInterval(audio._bgmFade);
    const startVolume = audio.volume;
    const start = performance.now();
    audio._bgmFade = setInterval(()=>{
      const progress = Math.min(1, (performance.now()-start)/duration);
      audio.volume = startVolume + (targetVolume-startVolume)*progress;
      if(progress === 1){
        clearInterval(audio._bgmFade);
        audio._bgmFade = null;
        if(after) after();
      }
    }, 32);
  }

  // 第一首歌使用兩個交替播放器：下一輪在結尾前 1.2 秒開始，
  // 同時把上一輪淡出，避免 loop 回到開頭時出現明顯斷點。
  function getGameDeck(){
    if(!gameDeck.length){
      for(let i=0;i<2;i++){
        const audio = new Audio(tracks.game.src);
        audio.loop = false;
        audio.volume = 0;
        gameDeck.push(audio);
      }
    }
    return gameDeck;
  }

  function startGameLoop(index, previousIndex){
    const deck = getGameDeck();
    const next = deck[index];
    const previous = previousIndex === undefined ? null : deck[previousIndex];
    gameActive = index;
    next.currentTime = 0;
    next.volume = 0;
    next._gameSwapped = false;
    next.play().catch(()=>{});
    fadeTo(next, tracks.game.volume, 1200);
    if(previous){
      fadeTo(previous, 0, 1200, ()=>{
        previous.pause();
        previous.currentTime = 0;
      });
    }
    next.ontimeupdate = ()=>{
      if(current !== "game" || next._gameSwapped || !Number.isFinite(next.duration)) return;
      if(next.currentTime >= next.duration - 1.2){
        next._gameSwapped = true;
        startGameLoop(index === 0 ? 1 : 0, index);
      }
    };
    // 若瀏覽器錯過 timeupdate，仍然會自動開始下一輪。
    next.onended = ()=>{
      if(current === "game" && !next._gameSwapped){
        next._gameSwapped = true;
        startGameLoop(index === 0 ? 1 : 0, index);
      }
    };
  }

  function stopGameLoop(){
    gameDeck.forEach(audio=>{
      if(audio._bgmFade) clearInterval(audio._bgmFade);
      audio.ontimeupdate = null;
      audio.onended = null;
      audio.pause();
      audio.currentTime = 0;
      audio.volume = 0;
    });
  }

  return {
    play(name){
      if(current === name) return;
      if(name === "game"){
        const previous = current ? players[current] : null;
        if(previous){
          fadeTo(previous, 0, 650, ()=>{ previous.pause(); previous.currentTime = 0; });
        }
        current = "game";
        stopGameLoop();
        startGameLoop(0);
        return;
      }
      stopGameLoop();
      const previous = current ? players[current] : null;
      const audio = playerFor(name);
      if(!audio) return;
      current = name;
      audio.currentTime = 0;
      audio.volume = 0;
      audio.play().catch(()=>{});
      fadeTo(audio, tracks[name].volume, 650);
      // 第一首歌切到回憶時會在同一段時間淡出，形成交叉淡化；
      // 後續曲目切換沿用相同行為，避免任何背景音突然中斷。
      if(previous && previous !== audio){
        fadeTo(previous, 0, 650, ()=>{
          previous.pause();
          previous.currentTime = 0;
        });
      }
    },
    stop(){
      Object.values(players).forEach(audio=>{
        if(audio._bgmFade) clearInterval(audio._bgmFade);
        audio.pause();
        audio.currentTime = 0;
      });
      stopGameLoop();
      current = null;
    },
  };
})();

/* ================================================================
   ⬇️⬇️⬇️ 以下是遊戲邏輯，如果你不熟悉程式碼，建議不要修改 ⬇️⬇️⬇️
   ================================================================ */
(function(){
  "use strict";

  // ---------- DOM 參照 ----------
  const startScreen  = document.getElementById("start-screen");
  const gameScreen   = document.getElementById("game-screen");
  const endingScreen = document.getElementById("ending-screen");
  const startBtn     = document.getElementById("start-btn");
  const bubbleField  = document.getElementById("bubble-field");
  const popup        = document.getElementById("popup");
  const popupName    = document.getElementById("popup-name");
  const popupComment = document.getElementById("popup-comment");
  const remiFull     = document.getElementById("remi-fullscreen");
  const endingText   = document.getElementById("ending-text");
  const nextBtn      = document.getElementById("next-btn");
  const restartLink  = document.getElementById("restart-link");
  const page2Screen  = document.getElementById("page2-screen");

  // ---------- 狀態 ----------
  let remiPercent   = SETTINGS.remiStartPercent;
  let gameEnded     = false;
  let gameStarted   = false;
  let foodFound     = false;
  let foodSpawned   = false;
  let activeBubbles = []; // { el, top, speed, char }
  let spawnTimeoutId = null;
  let foodTimeoutId  = null;
  let rafId = null;
  let lastTime = null;
  let popupTimer = null;

  // 依螢幕寬度算出縮放比例，讓手機上泡泡不會太大
  function sizeScale(){
    return Math.max(0.62, Math.min(1, window.innerWidth / 480));
  }

  // ---------- 音效引擎：用 Web Audio API 現場合成音效，不需要音檔 ----------
  const SFX = (function(){
    let ctx = null;
    function getCtx(){
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        ctx = new AC();
      }
      if(ctx.state === "suspended") ctx.resume();
      return ctx;
    }

    // 一個簡單的音調 (frequency 會從 freqStart 滑到 freqEnd)
    function tone(freqStart, freqEnd, duration, type, peak, delay){
      const c = getCtx();
      if(!c) return;
      const t0 = c.currentTime + (delay||0);
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(Math.max(freqStart,1), t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0+duration);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(peak||0.25, t0+duration*0.18);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0+duration+0.05);
    }

    // 一段濾波過的白噪音 (用來做 whoosh / pop 的氣音)
    function noiseBurst(duration, peak, filterStart, filterEnd, delay){
      const c = getCtx();
      if(!c) return;
      const t0 = c.currentTime + (delay||0);
      const bufferSize = Math.max(1, Math.floor(c.sampleRate*duration));
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
      const noise = c.createBufferSource();
      noise.buffer = buffer;
      const filter = c.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(filterStart, t0);
      filter.frequency.exponentialRampToValueAtTime(Math.max(filterEnd,50), t0+duration);
      const gain = c.createGain();
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(peak||0.2, t0+duration*0.12);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
      noise.connect(filter).connect(gain).connect(c.destination);
      noise.start(t0);
      noise.stop(t0+duration+0.02);
    }

    return {
      unlock(){ getCtx(); }, // 在使用者第一次點擊時呼叫，解鎖瀏覽器音訊權限
      pop(){ tone(320, 920, 0.12, "sine", 0.3, 0); },
      whoosh(){ noiseBurst(0.32, 0.18, 2800, 260, 0); },
      cuteError(){
        tone(520, 380, 0.12, "triangle", 0.22, 0);
        tone(400, 300, 0.14, "triangle", 0.2, 0.09);
      },
      growth(){
        tone(440, 660, 0.18, "sine", 0.22, 0);
        tone(660, 900, 0.2, "sine", 0.2, 0.11);
      },
      success(){
        [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>{
          tone(f, f, 0.22, "sine", 0.25, i*0.09);
        });
      },
    };
  })();

  // ---------- 音效播放 (合成音效 + 動物叫聲音檔) ----------
  function playSound(key){
    switch(key){
      case "wrong":     SFX.cuteError(); return;
      case "tuxEscape": SFX.whoosh();    return;
      case "foodClick": SFX.pop();       return;
      case "remiGrow":  SFX.growth();    return;
      case "ending":    SFX.success();   return;
      case "meow":
      case "snore":
      case "guinea":
        playAnimalSound(key);
        return;
      default: return;
    }
  }

  // 動物聲音用音檔播放，找不到檔案會安靜失敗，不影響遊戲
  function playAnimalSound(key){
    const src = ANIMAL_SOUNDS[key];
    if(!src) return;
    try{
      const a = new Audio(src);
      a.volume = 0.7;
      a.play().catch(()=>{});
    }catch(e){ /* 忽略 */ }
  }

  // ---------- 背景漂浮裝飾 ----------
  function fillDeco(container, count){
    const items = ["❤️","💕","🎈","✨","💗","🎉"];
    for(let i=0;i<count;i++){
      const el = document.createElement("div");
      el.className = "deco-item";
      el.textContent = items[Math.floor(Math.random()*items.length)];
      el.style.left = (Math.random()*100)+"%";
      el.style.setProperty("--dx", (Math.random()*80-40)+"px");
      const dur = 9 + Math.random()*10;
      el.style.animationDuration = dur+"s";
      el.style.animationDelay = (-Math.random()*dur)+"s";
      el.style.fontSize = (18+Math.random()*20)+"px";
      container.appendChild(el);
    }
  }
  fillDeco(document.getElementById("start-bg"), 14);

  // ---------- 開始遊戲 ----------
  startBtn.addEventListener("click", startGame);

  function startGame(){
    if(gameStarted) return;
    gameStarted = true;
    SFX.unlock(); // 解鎖瀏覽器音訊權限，之後才能播放合成音效
    BGM.play("game");
    startScreen.classList.add("fading-out");
    setTimeout(()=>{
      startScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
    }, 400);

    lastTime = null;
    requestAnimationFrame(fallLoop);
    scheduleSpawn();

    foodTimeoutId = setTimeout(spawnFoodIcon, SETTINGS.foodSpawnDelay);
  }

  // ---------- 泡泡產生排程 ----------
  function scheduleSpawn(){
    const wait = SETTINGS.spawnIntervalMin + Math.random()*(SETTINGS.spawnIntervalMax - SETTINGS.spawnIntervalMin);
    spawnTimeoutId = setTimeout(()=>{
      trySpawnBubble();
      scheduleSpawn();
    }, wait);
  }

  function availablePool(){
    return CHARACTERS.filter(c=>{
      if(c.removed) return false;
      if(c.special === "food" && !foodFound) return false;
      if(activeBubbles.some(b=>b.char.id===c.id)) return false;
      return true;
    });
  }

  function trySpawnBubble(){
    if(gameEnded) return;
    if(activeBubbles.length >= SETTINGS.maxConcurrentBubbles) return;
    const pool = availablePool();
    if(pool.length===0) return;
    const char = pool[Math.floor(Math.random()*pool.length)];
    spawnBubble(char, "top");
  }

  // ---------- 建立一個泡泡 ----------
  function spawnBubble(char, entrance){
    const scale = sizeScale();
    let diameter;
    if(char.special === "remi"){
      diameter = (50 + remiPercent*3) * scale;
      diameter = Math.min(diameter, 340);
    } else {
      diameter = (SETTINGS.bubbleSizeMin + Math.random()*(SETTINGS.bubbleSizeMax - SETTINGS.bubbleSizeMin)) * scale;
    }

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";
    wrap.style.width = diameter+"px";
    wrap.style.height = diameter+"px";

    const leftPercent = 6 + Math.random()*82;
    wrap.style.left = leftPercent+"%";

    let startTop;
    if(entrance === "side"){
      startTop = window.innerHeight*0.25 + Math.random()*window.innerHeight*0.4;
    } else {
      startTop = -diameter - 20;
    }
    wrap.style.top = startTop+"px";

    const inner = document.createElement("div");
    inner.className = "bubble bubble-inner-wobble" + (char.special==="remi" ? " remi-bubble" : "");
    inner.style.setProperty("--wobble-dist", (10+Math.random()*14)+"px");
    inner.style.animationDelay = (-Math.random()*3.4)+"s";
    inner.textContent = char.name;
    inner.style.fontSize = fitFontSize(char.name, diameter)+"px";
    inner.style.background = inner.style.background || bubbleGradient(char);

    wrap.appendChild(inner);
    bubbleField.appendChild(wrap);

    const speed = (SETTINGS.bubbleSpeedMin + Math.random()*(SETTINGS.bubbleSpeedMax - SETTINGS.bubbleSpeedMin)) * scale;

    const bubbleObj = {
      el: wrap,
      inner: inner,
      top: startTop,
      left: leftPercent,
      speed: speed,
      char: char,
    };

    if(entrance === "side"){
      const fromLeft = Math.random() < 0.5;
      wrap.style.left = (fromLeft ? -15 : 100) + "%";
      requestAnimationFrame(()=>{
        wrap.style.transition = "left .8s cubic-bezier(.22,1,.36,1)";
        wrap.style.left = leftPercent+"%";
        setTimeout(()=>{ wrap.style.transition=""; }, 850);
      });
    }

    wrap.addEventListener("click", ()=>onBubbleClick(bubbleObj));
    activeBubbles.push(bubbleObj);
    return bubbleObj;
  }

  const PALETTE = [
    "linear-gradient(150deg,#FFF3F7,#FFD3E2)",
    "linear-gradient(150deg,#F3ECFF,#DCC9FF)",
    "linear-gradient(150deg,#FFF6E5,#FFE1A8)",
    "linear-gradient(150deg,#E9FBF3,#BFF0D8)",
    "linear-gradient(150deg,#EAF3FF,#C9DDFF)",
  ];
  function bubbleGradient(char){
    if(char.special==="remi") return "";
    const idx = Math.abs(hashStr(char.id)) % PALETTE.length;
    return PALETTE[idx];
  }
  function hashStr(s){
    let h=0; for(let i=0;i<s.length;i++){ h = (h<<5)-h + s.charCodeAt(i); h|=0; } return h;
  }

  // 讓泡泡裡的名字永遠維持一行，太長的名字會自動縮小字級，不會被硬換行
  function fitFontSize(text, diameter){
    const base = Math.max(12, diameter*0.19);
    const usableWidth = diameter * 0.78; // 扣掉左右內距，留一點呼吸空間
    const hasCJK = /[\u4e00-\u9fff]/.test(text);
    // 中文字大約是正方形 (寬 ≈ 字級)，英文字母平均寬度大約是字級的 0.58 倍
    const avgCharWidthFactor = hasCJK ? 1.05 : 0.58;
    const estWidth = text.length * base * avgCharWidthFactor;
    let fontSize = base;
    if(estWidth > usableWidth){
      fontSize = base * (usableWidth / estWidth);
    }
    return Math.max(9, Math.round(fontSize*10)/10);
  }

  // ---------- 下墜動畫迴圈 ----------
  // 沒點到的泡泡不會消失，會一直往下掉，最後停在畫面最底部疊著，
  // 玩家隨時都還可以點到它 (包含 Remi)。
  function fallLoop(ts){
    if(!gameEnded){
      if(lastTime===null) lastTime = ts;
      const dt = (ts - lastTime)/1000;
      lastTime = ts;

      const fieldHeight = bubbleField.clientHeight;
      activeBubbles.forEach(b=>{
        if(b.landed) return;
        const diameter = b.el.clientHeight || parseFloat(b.el.style.height) || 0;
        const restTop = fieldHeight - diameter;
        b.top += b.speed*dt;
        if(b.top >= restTop){
          b.top = restTop;
          b.landed = true;
        }
        b.el.style.top = b.top+"px";
      });
    }
    rafId = requestAnimationFrame(fallLoop);
  }

  // ---------- 點擊泡泡處理 ----------
  function onBubbleClick(bubbleObj){
    if(gameEnded) return;
    const char = bubbleObj.char;

    // 避免重複觸發
    bubbleObj.el.style.pointerEvents = "none";

    if(char.special === "remi"){
      // 先讓遊戲整個畫面凍結 (不再生成/移動其他泡泡)，
      // 跳出跟其他人物一樣的訊息卡：「Remi loves you 10000000000% 💗」，
      // 讓玩家看清楚這個答案，稍微停留一下之後，才切換到結局畫面。
      gameEnded = true;
      clearTimeout(spawnTimeoutId);
      clearTimeout(foodTimeoutId);
      removeBubbleImmediate(bubbleObj);
      showRemiPopup();
      setTimeout(runFastForward, 1700);
      return;
    }

    if(char.special === "tux" && !char.tuxEscaped){
      char.tuxEscaped = true;
      teleportBubble(bubbleObj);
      playSound("tuxEscape");
      bubbleObj.el.style.pointerEvents = "auto"; // 可以再次被點擊
      return;
    }

    // ---- 一般人物 (含 Tux 第二次 / 睡覺系 / 老鼠) ----
    char.removed = true;
    showPopup(char);

    if(char.special === "sleepy"){
      bubbleObj.inner.classList.add("sleepy-wobble");
      playSound("snore");
      setTimeout(()=>removeBubbleWithAnim(bubbleObj), 420);
    } else {
      playSound(char.sound || "wrong");
      removeBubbleWithAnim(bubbleObj);
    }

    incrementRemi(SETTINGS.remiIncrement);
  }

  function teleportBubble(bubbleObj){
    const fieldW = bubbleField.clientWidth;
    const fieldH = bubbleField.clientHeight;
    const diameter = bubbleObj.el.clientWidth;
    const newLeftPercent = 6 + Math.random()*82;
    const newTop = Math.max(20, Math.random()*(fieldH - diameter - 80));

    bubbleObj.el.classList.add("poof");
    setTimeout(()=>bubbleObj.el.classList.remove("poof"), 460);

    bubbleObj.left = newLeftPercent;
    bubbleObj.top = newTop;
    bubbleObj.el.style.left = newLeftPercent+"%";
    bubbleObj.el.style.top = newTop+"px";
  }

  function removeBubbleWithAnim(bubbleObj){
    bubbleObj.el.classList.add("pop-out");
    setTimeout(()=>{
      bubbleObj.el.remove();
      activeBubbles = activeBubbles.filter(b=>b!==bubbleObj);
    }, 260);
  }
  function removeBubbleImmediate(bubbleObj){
    bubbleObj.el.remove();
    activeBubbles = activeBubbles.filter(b=>b!==bubbleObj);
  }

  // ---------- 彈出人物訊息卡 ----------
  function showPopup(char){
    popupName.textContent = `${char.name} loves you ${char.loved}% ❤️`;
    popupComment.textContent = char.comment;
    popup.classList.add("show");
    clearTimeout(popupTimer);
    popupTimer = setTimeout(()=>{
      popup.classList.remove("show");
    }, SETTINGS.popupDuration);
  }

  // ---------- 點到 Remi 時，跳出專屬的訊息卡 ----------
  function showRemiPopup(){
    popupName.textContent = "Remi loves you 10000000000% \uD83D\uDC97";
    popupComment.textContent = "";
    popup.classList.add("show");
    clearTimeout(popupTimer);
    popupTimer = setTimeout(()=>{
      popup.classList.remove("show");
    }, 1400);
  }

  // ---------- Remi 增加 % ----------
  function incrementRemi(amount){
    if(gameEnded) return;
    remiPercent = Math.min(100, remiPercent + amount);
    playSound("remiGrow");

    // 如果 Remi 泡泡目前正在畫面上，讓它平滑放大
    const remiBubble = activeBubbles.find(b=>b.char.special==="remi");
    if(remiBubble){
      const scale = sizeScale();
      let diameter = Math.min((50 + remiPercent*3)*scale, 340);
      remiBubble.el.style.transition = "width .55s cubic-bezier(.34,1.56,.64,1), height .55s cubic-bezier(.34,1.56,.64,1)";
      remiBubble.el.style.width = diameter+"px";
      remiBubble.el.style.height = diameter+"px";
      remiBubble.inner.classList.remove("pulse");
      void remiBubble.inner.offsetWidth; // 重新觸發動畫
      remiBubble.inner.classList.add("pulse");
    }

    // 注意：即使 % 已經到達 100，也不會自動結束遊戲。
    // 一定要玩家親自點到 Remi 的泡泡，遊戲才會結束 (見 onBubbleClick 裡的 special==="remi" 分支)。
  }

  // ---------- 玩家一開始就點到 Remi：快速放大結局 ----------
  function runFastForward(){
    gameEnded = true;
    clearTimeout(spawnTimeoutId);
    clearTimeout(foodTimeoutId);
    clearAllBubblesFast();

    const stages = [30, 60, 100];
    let i = 0;
    function nextStage(){
      if(i >= stages.length){
        finishEnding();
        return;
      }
      remiPercent = stages[i];
      playSound("remiGrow");
      i++;
      setTimeout(nextStage, 480);
    }
    // 先把畫面切到結局容器，用 remi-fullscreen 元素放大
    prepareEndingScreen();
    setTimeout(nextStage, 250);
  }

  function clearAllBubblesFast(){
    activeBubbles.forEach(b=>b.el.remove());
    activeBubbles = [];
  }

  function prepareEndingScreen(){
    gameScreen.classList.add("hidden");
    endingScreen.classList.remove("hidden");
    const scale = sizeScale();
    const startDiameter = Math.min((50 + SETTINGS.remiStartPercent*3)*scale, 340);
    remiFull.style.width = startDiameter+"px";
    remiFull.style.height = startDiameter+"px";
  }

  function finishEnding(){
    // 放大到滿版
    const bigSize = Math.max(window.innerWidth, window.innerHeight) * 2.2;
    remiFull.style.transition = "width .9s cubic-bezier(.22,1,.36,1), height .9s cubic-bezier(.22,1,.36,1)";
    remiFull.style.width = bigSize+"px";
    remiFull.style.height = bigSize+"px";
    playSound("ending");
    spawnHeartBurst(6);

    setTimeout(()=>{
      endingText.classList.add("show");
      spawnHeartBurst(10);
    }, 700);

    setTimeout(()=>{
      nextBtn.classList.add("show");
      restartLink.classList.add("show");
    }, 1900);
  }

  function spawnHeartBurst(count){
    for(let i=0;i<count;i++){
      const h = document.createElement("div");
      h.className = "heart-particle";
      h.textContent = ["❤️","💕","💖","✨"][Math.floor(Math.random()*4)];
      h.style.left = (10+Math.random()*80)+"%";
      h.style.top = (40+Math.random()*40)+"%";
      h.style.animationDelay = (Math.random()*0.6)+"s";
      endingScreen.appendChild(h);
      setTimeout(()=>h.remove(), 2600);
    }
  }

  // ---------- 食物彩蛋 ----------
  function spawnFoodIcon(){
    if(gameEnded || foodSpawned) return;
    foodSpawned = true;
    const icons = ["🥕"];
    const icon = document.createElement("div");
    icon.className = "food-icon";
    icon.textContent = icons[Math.floor(Math.random()*icons.length)];
    icon.style.left = (12 + Math.random()*70)+"%";
    icon.style.top = (18 + Math.random()*50)+"%";
    icon.addEventListener("click", onFoodClick);
    bubbleField.appendChild(icon);

    icon._el = icon;
    window.__foodIconEl = icon;
  }

  function onFoodClick(){
    if(foodFound || gameEnded) return;
    foodFound = true;
    const el = window.__foodIconEl;
    if(el) el.remove();
    playSound("foodClick");

    const chocolate = CHARACTERS.find(c=>c.id==="chocolate");
    const marshmallow = CHARACTERS.find(c=>c.id==="marshmallow");
    if(chocolate && !chocolate.removed) spawnBubble(chocolate, "side");
    if(marshmallow && !marshmallow.removed) spawnBubble(marshmallow, "side");
  }

  // ---------- NEXT → 照片回憶頁 ----------
  const photosScreen = document.getElementById("photos-screen");
  nextBtn.addEventListener("click", ()=>{
    endingScreen.classList.add("hidden");
    photosScreen.classList.remove("hidden");
    BGM.play("memories");
  });

  // ---------- 重新開始 (方便你測試用，可自由刪除這個小功能) ----------
  restartLink.addEventListener("click", ()=>{
    window.location.reload();
  });

})();
</script>
<script>
/* ================================================================
   💌 CONFIG 資料設定區 — 你可以放心修改這一整塊
   ================================================================ */
const CONFIG = {
  startDate: "1996-08-29",
  endDate:   "2026-08-29",

  pourDurationMs: 8000,
  sandGrainCount: 720,
  sandGrainSize: [1.1, 2.8],

  yearRollDurationMs: 10000,

  pauseBeforeFade: 650,
  fadeParticlesMs: 1000,
  pauseBeforeNumber: 250,
  pauseBeforeCongrats: 750,
  pauseBeforeEnvelope: 1300,

  letterLines: [
    "謝謝你出現在這個世界，讓我遇見了你",
    "你的可愛、小脾氣我都好喜歡",
    "今天是你30歲生日",
    "我們不用變得很成熟",
    "不用變得很有目標",
    "你還是我360月大的小寶貝",
    "過去很多事情沒有陪伴著你",
    "希望未來可以跟你一起經歷",
    "甘甜的事情苦澀難過的事情",
    "360月的小寶貝繼續放心的去體驗這一切"
  ],
  lineStaggerMs: 480,
  finalLineExtraDelayMs: 1500,
};

/* ================================================================
   ⬇️⬇️⬇️ 以下是頁面邏輯，如果你不熟悉程式碼，建議不要修改 ⬇️⬇️⬇️
   ================================================================ */
(function(){
  "use strict";

  const tapHint        = document.getElementById("tap-hint");
  const birthDateEl    = document.getElementById("birth-date");
  const daysLabel       = document.getElementById("days-label");
  const bottleWrap      = document.getElementById("bottle-wrap");
  const canvas          = document.getElementById("day-canvas");
  const ctx              = canvas.getContext("2d");
  const number30        = document.getElementById("number-30");
  const congratsText    = document.getElementById("congrats-text");
  const envelopeWrap     = document.getElementById("envelope-wrap");
  const envelopeBtn      = document.getElementById("envelope-btn");
  const letterOverlay   = document.getElementById("letter-overlay");
  const letterCard      = document.getElementById("letter-card");
  const letterLinesEl   = document.getElementById("letter-lines");
  const closeLetterBtn  = document.getElementById("close-letter");
  const restartWrap     = document.getElementById("restart-wrap");
  const restartBtn      = document.getElementById("restart-btn");

  const VB_W = 300, VB_H = 420;
  // 讓畫布比瓶子高一小段，才能看見沙流從瓶口上方滑進來。
  const STREAM_HEADROOM = 74;

  const BOTTLE = {
    funnelEndY: 96,
    // day 堆到瓶頸下方就視為填滿，不能再往上長到瓶外。
    fillCeilingY: 108,
    bodyLeft: 46, bodyRight: 254,
    floorY: 394,
    pathData: "M120,4 L180,4 L180,58 C180,74 200,78 214,96 C246,132 258,158 258,206 L258,332 C258,368 234,394 198,400 C186,402 114,402 102,400 C66,394 42,368 42,332 L42,206 C42,158 54,132 86,96 C100,78 120,74 120,58 Z",
  };
  let bottleClipPath = null;
  try{ bottleClipPath = new Path2D(BOTTLE.pathData); }catch(e){ bottleClipPath = null; }

  // 舊版 Safari 不一定能由 SVG 字串建立 Path2D；保留相同輪廓的 fallback，
  // 確保 day 在每個瀏覽器都會被限制於瓶中。
  function clipToBottle(){
    if(bottleClipPath){
      ctx.clip(bottleClipPath);
      return;
    }
    ctx.beginPath();
    ctx.moveTo(120,4); ctx.lineTo(180,4); ctx.lineTo(180,58);
    ctx.bezierCurveTo(180,74,200,78,214,96);
    ctx.bezierCurveTo(246,132,258,158,258,206);
    ctx.lineTo(258,332); ctx.bezierCurveTo(258,368,234,394,198,400);
    ctx.bezierCurveTo(186,402,114,402,102,400);
    ctx.bezierCurveTo(66,394,42,368,42,332);
    ctx.lineTo(42,206); ctx.bezierCurveTo(42,158,54,132,86,96);
    ctx.bezierCurveTo(100,78,120,74,120,58);
    ctx.closePath();
    ctx.clip();
  }

  let started = false;
  function wait(ms){ return new Promise(resolve=>setTimeout(resolve, ms)); }

  const SFX = (function(){
    let actx = null;
    function getCtx(){
      if(!actx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        actx = new AC();
      }
      if(actx.state === "suspended") actx.resume();
      return actx;
    }
    function tone(freqStart, freqEnd, duration, type, peak, delay){
      const c = getCtx();
      if(!c) return;
      const t0 = c.currentTime + (delay||0);
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(Math.max(freqStart,1), t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0+duration);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(peak||0.15, t0+duration*0.3);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
      osc.connect(gain).connect(c.destination);
      osc.start(t0); osc.stop(t0+duration+0.05);
    }
    function noiseBurst(duration, peak, filterStart, filterEnd, delay){
      const c = getCtx();
      if(!c) return;
      const t0 = c.currentTime + (delay||0);
      const bufferSize = Math.max(1, Math.floor(c.sampleRate*duration));
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
      const noise = c.createBufferSource();
      noise.buffer = buffer;
      const filter = c.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(filterStart, t0);
      filter.frequency.exponentialRampToValueAtTime(Math.max(filterEnd,50), t0+duration);
      const gain = c.createGain();
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(peak||0.12, t0+duration*0.2);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
      noise.connect(filter).connect(gain).connect(c.destination);
      noise.start(t0); noise.stop(t0+duration+0.02);
    }
    return {
      unlock(){ getCtx(); },
      dayDrop(){ tone(1000, 850, 0.05, "sine", 0.04, 0); },
      yearTick(){ tone(1400, 1200, 0.03, "square", 0.015, 0); },
      bottleFull(){
        tone(520, 640, 0.4, "sine", 0.16, 0);
        tone(640, 780, 0.5, "sine", 0.12, 0.22);
      },
      numberReveal(){
        tone(660, 660, 0.7, "sine", 0.2, 0);
        tone(990, 990, 0.7, "sine", 0.07, 0);
      },
      envelopeOpen(){
        noiseBurst(0.4, 0.1, 1800, 700, 0);
        noiseBurst(0.22, 0.07, 2400, 900, 0.16);
      },
      letterAppear(){ tone(500, 760, 0.55, "sine", 0.14, 0); },
    };
  })();

  const START_DATE = new Date(CONFIG.startDate+"T00:00:00");
  const END_DATE   = new Date(CONFIG.endDate+"T00:00:00");
  const START_YEAR = START_DATE.getFullYear();
  const END_YEAR   = END_DATE.getFullYear();
  const MONTH_STR  = String(START_DATE.getMonth()+1).padStart(2,"0");
  const DAY_STR    = String(START_DATE.getDate()).padStart(2,"0");

  function computeTotalDays(){
    return Math.round((END_DATE-START_DATE)/86400000);
  }
  daysLabel.textContent = computeTotalDays().toLocaleString("en-US") + " DAYS";

  function formatFullDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}/${m}/${day}`;
  }
  // 年份翻動時同一個月/日固定顯示，只有年份數字在跳動
  function formatRollingDate(year){
    return `${year}/${MONTH_STR}/${DAY_STR}`;
  }
  birthDateEl.textContent = formatFullDate(START_DATE);

  function runYearRoll(){
    return new Promise(resolve=>{
      birthDateEl.classList.add("counting");
      const totalYears = END_YEAR - START_YEAR;
      if(totalYears <= 0){
        birthDateEl.textContent = formatFullDate(END_DATE);
        resolve();
        return;
      }
      const start = performance.now();
      const dur = CONFIG.yearRollDurationMs;
      let lastYearShown = START_YEAR;
      birthDateEl.textContent = formatRollingDate(START_YEAR);
      function step(ts){
        const t = Math.min(1, (ts-start)/dur);
        const eased = 1 - Math.pow(1-t, 2.2);
        const currentYear = Math.min(END_YEAR, Math.floor(START_YEAR + eased*totalYears));
        if(t >= 1){
          birthDateEl.textContent = formatFullDate(END_DATE);
          resolve();
          return;
        }
        if(currentYear !== lastYearShown){
          lastYearShown = currentYear;
          birthDateEl.textContent = formatRollingDate(currentYear);
          SFX.yearTick();
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  function setupCanvas(){
    const rect = bottleWrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const scale = (rect.width/VB_W) * dpr;
    const headroomPx = STREAM_HEADROOM * scale;
    canvas.width = Math.max(1, Math.round(rect.width*dpr));
    canvas.height = Math.max(1, Math.round(rect.height*dpr + headroomPx));
    canvas.style.width = rect.width+"px";
    canvas.style.height = (rect.height + headroomPx/dpr)+"px";
    canvas.style.top = -(headroomPx/dpr)+"px";
    canvas.style.bottom = "auto";
    ctx.setTransform(scale, 0, 0, scale, 0, STREAM_HEADROOM*scale);
  }
  setupCanvas();
  window.addEventListener("resize", setupCanvas);

  // ---------- Day 粒子系統 (沙堆演算法) ----------
  /* 已停用：舊版 day 文字粒子、滾動與 heightMap 堆積邏輯。
     保留在此僅方便比對，沒有任何執行入口。 */
  /*
  const particles = [];
  const BUCKET_COUNT = 30;
  const heightMap = new Array(BUCKET_COUNT).fill(BOTTLE.floorY);
  const bucketWidth = (BOTTLE.bodyRight - BOTTLE.bodyLeft) / BUCKET_COUNT;

  function bucketIndexFor(x){
    let idx = Math.floor((x - BOTTLE.bodyLeft) / bucketWidth);
    if(idx < 0) idx = 0;
    if(idx >= BUCKET_COUNT) idx = BUCKET_COUNT-1;
    return idx;
  }

  // 高度差驅動：heightMap 的數值越小代表沙面越高。粒子碰到沙面後，
  // 只有在相鄰格比目前低（數值更大）達到安息角時才會往下滾；因此先在中間
  // 堆高，再沿著兩側坡面擴散，而不是一進瓶身就被預先分配到固定終點。
  function lowerNeighbour(bucket, size){
    const surfaceY = heightMap[bucket];
    const threshold = Math.max(2.4, size * 0.28) + Math.random()*1.8;
    const candidates = [];
    if(bucket > 0){
      const drop = heightMap[bucket-1] - surfaceY;
      if(drop > threshold) candidates.push({ bucket:bucket-1, drop });
    }
    if(bucket < BUCKET_COUNT-1){
      const drop = heightMap[bucket+1] - surfaceY;
      if(drop > threshold) candidates.push({ bucket:bucket+1, drop });
    }
    if(!candidates.length) return null;
    candidates.sort((a,b)=>b.drop-a.drop);
    // 落差很接近時偶爾選另一側，保留自然、不完全對稱的表面。
    return candidates.length > 1 && Math.abs(candidates[0].drop-candidates[1].drop) < 2.5 && Math.random() < .42
      ? candidates[1].bucket
      : candidates[0].bucket;
  }

  function spawnDay(){
    const size = CONFIG.daySize[0] + Math.random()*(CONFIG.daySize[1]-CONFIG.daySize[0]);
    particles.push({
      x: 150 + (Math.random()*16-8),
      y: -18 - Math.random()*30,
      vy: 62 + Math.random()*46,
      vx: (Math.random()*10-5),
      rot: (Math.random()*40-20) * Math.PI/180,
      rotSpeed: (Math.random()*1.2-0.6),
      size,
      phase: "falling",
      settleT: 0,
      alpha: 1,
      hue: Math.random(),
      bucket: null,
      targetBucket: null,
      targetX: null,
    });
  }

  function particleColor(p){
    const teal = [32,120,120];
    const coral = [255,140,120];
    const mix = p.hue;
    const r = Math.round(teal[0]+(coral[0]-teal[0])*mix);
    const g = Math.round(teal[1]+(coral[1]-teal[1])*mix);
    const b = Math.round(teal[2]+(coral[2]-teal[2])*mix);
    return `rgba(${r},${g},${b},${(0.55+mix*0.2)*p.alpha})`;
  }

  let emittedCount = 0;
  let emitAccumulator = 0;
  let pouring = false;
  let lastFrameTime = null;
  let particleFadeT = null;

  function settleParticle(p, bucket){
    const landingY = Math.max(BOTTLE.fillCeilingY, heightMap[bucket] - p.size*0.9);
    p.x = BOTTLE.bodyLeft + (bucket + 0.5) * bucketWidth;
    p.y = landingY;
    p.bucket = bucket;
    p.phase = "settled";
    p.settleT = 0;
    heightMap[bucket] = Math.max(BOTTLE.fillCeilingY, landingY - p.size*0.8);
    if(Math.random() < 0.18) SFX.dayDrop();
  }

  function updateParticles(dt){
    const emitRate = CONFIG.dayDensity / (CONFIG.pourDurationMs/1000);
    if(pouring && emittedCount < CONFIG.dayDensity){
      emitAccumulator += emitRate*dt;
      while(emitAccumulator >= 1 && emittedCount < CONFIG.dayDensity){
        spawnDay();
        emittedCount++;
        emitAccumulator -= 1;
      }
    }

    particles.forEach(p=>{
      if(p.phase === "falling"){
        p.y += p.vy*dt;
        p.vy += 30*dt;
        p.rot += p.rotSpeed*dt;

        if(p.y < BOTTLE.funnelEndY){
          // 瓶口窄，先收攏到瓶頸中心
          p.x += (150 - p.x) * Math.min(1, dt*2.2);
          p.x += p.vx*dt;
        } else {
          if(p.x < BOTTLE.bodyLeft+p.size) p.x = BOTTLE.bodyLeft+p.size;
          if(p.x > BOTTLE.bodyRight-p.size) p.x = BOTTLE.bodyRight-p.size;
          const bucket = bucketIndexFor(p.x);
          const landingY = Math.max(BOTTLE.fillCeilingY, heightMap[bucket] - p.size*0.9);
          if(p.y >= landingY){
            p.y = landingY;
            p.bucket = bucket;
            p.targetBucket = lowerNeighbour(bucket, p.size);
            if(p.targetBucket === null){
              settleParticle(p, bucket);
            } else {
              p.targetX = BOTTLE.bodyLeft + (p.targetBucket + 0.5) * bucketWidth;
              p.phase = "rolling";
              p.vy = 12;
            }
          }
        }
      } else if(p.phase === "rolling"){
        // 每跨過一格就重新讀取最新沙面；前面的粒子堆高後，後面的粒子會被
        // 高度差帶往較低的一側，直到坡度低於安息角才停住。
        const direction = Math.sign(p.targetX-p.x);
        p.x += direction * Math.min(Math.abs(p.targetX-p.x), dt*(72 + Math.abs(heightMap[p.targetBucket]-heightMap[p.bucket])*9));
        p.vy += 42*dt;
        const targetLandingY = Math.max(BOTTLE.fillCeilingY, heightMap[p.targetBucket] - p.size*0.9);
        p.y = Math.min(targetLandingY, p.y + p.vy*dt);
        p.rot += direction * dt*1.7;
        if(Math.abs(p.targetX-p.x) < .25){
          p.x = p.targetX;
          p.bucket = p.targetBucket;
          const nextBucket = lowerNeighbour(p.bucket, p.size);
          if(nextBucket !== null){
            p.targetBucket = nextBucket;
            p.targetX = BOTTLE.bodyLeft + (nextBucket + 0.5) * bucketWidth;
          } else if(p.y >= Math.max(BOTTLE.fillCeilingY, heightMap[p.bucket] - p.size*0.9) - .25){
            settleParticle(p, p.bucket);
          }
        }
      } else if(p.phase === "settled" && p.settleT < 1){
        p.settleT = Math.min(1, p.settleT + dt*3.2);
      }

      if(particleFadeT !== null){
        p.alpha = Math.max(0, 1-particleFadeT);

  }

  function drawParticles(){
    ctx.clearRect(0,0,VB_W,VB_H);

    ctx.save();
    // 無論在瓶口或瓶身，day 都只能畫在玻璃輪廓內；這也避免高密度時
    // 個別字卡在瓶頸附近而看起來跑出瓶子。
    clipToBottle();
    particles.forEach(p=>{
      drawOneDay(p);
    });
    ctx.restore();
  }

  function drawOneDay(p){
    if(p.alpha <= 0.01) return;
    const bounce = p.phase==="settled" ? Math.sin(p.settleT*Math.PI) * p.size*0.18*(1-p.settleT) : 0;
    ctx.save();
    ctx.translate(p.x, p.y - bounce);
    ctx.rotate(p.rot);
    ctx.font = `600 ${p.size}px 'Quicksand', system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

  function allSettledOrDone(){
    if(emittedCount < CONFIG.dayDensity) return false;
    return particles.every(p=>p.phase === "settled");
  }

  */
  // ---------- 新流沙視覺 ----------
  // 這套系統取代舊的 day 文字粒子。粒子只會在 pouring 為 true 時產生；
  // 一旦落在沙丘上就轉成靜態細節，沒有滾動、彈跳或後續生成。
  const flowingSand = [];
  const settledSand = [];
  let sandEmitted = 0;
  let sandAccumulator = 0;
  let sandSettled = 0;
  let sandPouring = false;
  let lastFrameTime = null;
  let particleFadeT = null;

  function sandProgress(){
    return Math.min(1, sandSettled / CONFIG.sandGrainCount);
  }

  function sandSurfaceY(x, progress){
    const normalized = Math.abs((x - 150) / 104);
    const mound = .34 + .66 * Math.pow(Math.max(0, 1-normalized), 1.5);
    const irregular = Math.sin(x*.17)*1.7 + Math.sin(x*.061+1.4)*1.15;
    return BOTTLE.floorY - progress*(78 + 178*mound) + irregular*progress;
  }

  function spawnSandGrain(){
    const size = CONFIG.sandGrainSize[0] + Math.random()*(CONFIG.sandGrainSize[1]-CONFIG.sandGrainSize[0]);
    const spread = 18 + sandProgress()*82;
    flowingSand.push({
      x: 150 + (Math.random()-.5)*3.5,
      y: -58 + Math.random()*12,
      vy: 86 + Math.random()*20,
      targetX: Math.max(54, Math.min(246, 150 + (Math.random()-.5)*spread*2)),
      size,
      alpha: .42 + Math.random()*.35,
    });
  }

  function settleSandGrain(grain){
    sandSettled++;
    settledSand.push({
      x: grain.x,
      y: sandSurfaceY(grain.x, sandProgress()) + Math.random()*3.5,
      size: grain.size,
      alpha: grain.alpha*.68,
    });
    // 沙丘以連續曲線呈現，靜態顆粒只留少量質感，不會無限累積。
    if(settledSand.length > 300) settledSand.shift();
    if(sandSettled % 24 === 0) SFX.dayDrop();
  }

  function updateFlowingSand(dt){
    if(sandPouring && sandEmitted < CONFIG.sandGrainCount){
      sandAccumulator += (CONFIG.sandGrainCount/(CONFIG.pourDurationMs/1000))*dt;
      while(sandAccumulator >= 1 && sandEmitted < CONFIG.sandGrainCount){
        spawnSandGrain();
        sandEmitted++;
        sandAccumulator--;
      }
    }
    for(let i=flowingSand.length-1;i>=0;i--){
      const grain = flowingSand[i];
      grain.vy = Math.min(205, grain.vy + 52*dt);
      grain.y += grain.vy*dt;
      // 通過細瓶頸後才慢慢向兩側散開，保留流沙般的中央流線。
      if(grain.y >= BOTTLE.funnelEndY){
        grain.x += (grain.targetX-grain.x)*Math.min(1, dt*1.45);
      }
      if(grain.y >= sandSurfaceY(grain.x, sandProgress())){
        grain.y = sandSurfaceY(grain.x, sandProgress());
        settleSandGrain(grain);
        flowingSand.splice(i,1);
      }
    }
  }

  function drawFlowingSand(){
    ctx.clearRect(0,-STREAM_HEADROOM,VB_W,VB_H+STREAM_HEADROOM);
    const progress = sandProgress();
    const fade = particleFadeT === null ? 1 : 1-particleFadeT;
    // 瓶口上方的細流不裁切，讓人看見沙子由上而下滑入瓶口。
    flowingSand.forEach(grain=>{
      if(grain.y >= BOTTLE.funnelEndY) return;
      ctx.fillStyle = `rgba(255, 221, 181, ${grain.alpha*fade})`;
      ctx.beginPath(); ctx.ellipse(grain.x, grain.y, grain.size*.42, grain.size*.72, 0, 0, Math.PI*2); ctx.fill();
    });
    ctx.save();
    clipToBottle();
    if(progress > 0){
      const gradient = ctx.createLinearGradient(82,130,218,400);
      gradient.addColorStop(0, "rgba(255, 205, 161, .78)");
      gradient.addColorStop(1, "rgba(218, 119, 103, .74)");
      ctx.beginPath();
      ctx.moveTo(BOTTLE.bodyLeft, BOTTLE.floorY);
      for(let x=BOTTLE.bodyLeft;x<=BOTTLE.bodyRight;x+=4) ctx.lineTo(x, sandSurfaceY(x, progress));
      ctx.lineTo(BOTTLE.bodyRight, BOTTLE.floorY);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();
    }
    settledSand.forEach(grain=>{
      ctx.fillStyle = `rgba(245, 187, 144, ${grain.alpha*fade})`;
      ctx.beginPath(); ctx.arc(grain.x, grain.y, grain.size*.46, 0, Math.PI*2); ctx.fill();
    });
    flowingSand.forEach(grain=>{
      if(grain.y < BOTTLE.funnelEndY) return;
      ctx.fillStyle = `rgba(255, 221, 181, ${grain.alpha*fade})`;
      ctx.beginPath(); ctx.ellipse(grain.x, grain.y, grain.size*.42, grain.size*.72, 0, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  function frameLoop(ts){
    if(lastFrameTime===null) lastFrameTime = ts;
    const dt = Math.min(0.05, (ts-lastFrameTime)/1000);
    lastFrameTime = ts;
    updateFlowingSand(dt);
    drawFlowingSand();
    requestAnimationFrame(frameLoop);
  }
  requestAnimationFrame(frameLoop);

  function pourSand(){
    sandPouring = true;
    return new Promise(resolve=>{
      const check = setInterval(()=>{
        if(sandEmitted === CONFIG.sandGrainCount && flowingSand.length === 0){
          clearInterval(check);
          sandPouring = false;
          resolve();
        }
      }, 150);
    });
  }

  function fadeOutParticles(){
    return new Promise(resolve=>{
      canvas.classList.add("fade-out");
      const start = performance.now();
      const dur = CONFIG.fadeParticlesMs;
      function step(ts){
        const t = Math.min(1, (ts-start)/dur);
        particleFadeT = t;
        if(t < 1){
          requestAnimationFrame(step);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(step);
    });
  }

  async function runSequence(){
    await wait(300);
    birthDateEl.classList.add("show");
    daysLabel.classList.add("show");

    await wait(900);
    const pourPromise = pourSand();
    await runYearRoll();
    await pourPromise;

    await wait(CONFIG.pauseBeforeFade);
    birthDateEl.classList.add("fade-out");
    daysLabel.classList.add("fade-out");
    await fadeOutParticles();
    SFX.bottleFull();

    await wait(CONFIG.pauseBeforeNumber);
    number30.classList.add("show");
    BGM.play("birthday");
    SFX.numberReveal();

    await wait(CONFIG.pauseBeforeCongrats);
    congratsText.classList.add("show");

    await wait(CONFIG.pauseBeforeEnvelope);
    envelopeWrap.classList.add("show");
    restartWrap.classList.add("show");
  }

  function beginExperience(){
    if(started) return;
    started = true;
    SFX.unlock();
    tapHint.classList.add("hidden");
    runSequence();
  }
  const page2Screen = document.getElementById("page2-screen");
  page2Screen.addEventListener("page2:shown", ()=>{
    setupCanvas();
    beginExperience();
  });
  page2Screen.addEventListener("click", (e)=>{
    if(started) return;
    // 保留點擊作為備援：若頁面被其他方式直接顯示，仍可開始播放。
    setupCanvas();
    beginExperience();
  });

  function buildLetterLines(){
    letterLinesEl.innerHTML = "";
    const lines = CONFIG.letterLines;
    lines.forEach((text, i)=>{
      const p = document.createElement("p");
      p.textContent = text;
      p.className = "letter-line";
      if(i === lines.length-1) p.classList.add("letter-line-final");
      letterLinesEl.appendChild(p);
    });
  }
  buildLetterLines();

  async function revealLetterLines(){
    const lineEls = Array.from(letterLinesEl.querySelectorAll(".letter-line"));
    for(let i=0;i<lineEls.length;i++){
      const isFinal = i === lineEls.length-1;
      if(isFinal){
        await wait(CONFIG.finalLineExtraDelayMs);
      } else if(i>0){
        await wait(CONFIG.lineStaggerMs);
      }
      lineEls[i].classList.add("show");
    }
    await wait(500);
    closeLetterBtn.classList.add("show");
  }

  let envelopeOpenedOnce = false;
  envelopeBtn.addEventListener("click", async (e)=>{
    e.stopPropagation();

    if(!envelopeOpenedOnce){
      // 第一次打開：完整播放拆信封動畫
      envelopeOpenedOnce = true;
      envelopeBtn.classList.add("opening");
      SFX.envelopeOpen();
      envelopeBtn.textContent = "💌";

      await wait(550);
      letterOverlay.classList.add("show");
      requestAnimationFrame(()=>{
        letterCard.classList.add("show");
      });
      SFX.letterAppear();

      await wait(600);
      revealLetterLines();
    } else {
      // 已經打開過一次了：直接重新顯示信件 (文字已經是展開狀態，不用再等)
      SFX.letterAppear();
      letterOverlay.classList.add("show");
      letterCard.classList.add("show");
    }
  });

  closeLetterBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    letterOverlay.classList.remove("show");
  });
  letterOverlay.addEventListener("click", (e)=>{
    if(e.target === letterOverlay){
      letterOverlay.classList.remove("show");
    }
  });

  restartBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    // 回到整個網頁最初的狀態 (第一頁)
    window.location.reload();
  });

})();
</script>


<script>
/* ================================================================
   📷 紐西蘭回憶相簿設定區
   ================================================================

   ⚠️ 照片使用方式：
   1. 把你的照片檔案（例如 nz-1.jpg, nz-2.jpg ...）跟這個 html 檔放在
      同一個資料夾裡。
   2. 下面 PHOTOS 陣列裡，"src" 填照片的檔名（如果照片放在子資料夾，
      例如 photos/nz-1.jpg，就把 src 寫成 "photos/nz-1.jpg"）。
   3. "caption" 是照片下面要顯示的文字，可以留空字串 "" 表示不顯示文字。
   4. 想加照片就在陣列裡多加一行 { src: "...", caption: "..." }，
      想刪照片就整行刪掉即可，順序就是瀏覽的順序。
   ================================================================ */
const PHOTOS = [
  { src: "nz-1.jpg", caption: "這張可以榮獲最佳情侶照其中之一" },
  { src: "nz-2.jpg", caption: "喜歡妳笑倒在我的懷裡放心的樣子" },
  { src: "nz-3.jpg", caption: "我們經歷了好多不一樣的美景" },
  { src: "nz-4.jpg", caption: "但最美的還是" },
  { src: "nz-5.jpg", caption: "你" },
  { src: "nz-6.jpg", caption: "想跟你一直看那鏡頭下的美景" },
];

(function(){
  "use strict";

  const screen        = document.getElementById("photos-screen");
  const imgEl         = document.getElementById("photo-img");
  const prevZone      = document.getElementById("photo-prev-zone");
  const nextZone      = document.getElementById("photo-next-zone");
  const counterEl     = document.getElementById("photo-counter");
  const captionEl     = document.getElementById("photo-caption");
  const photosNextBtn = document.getElementById("photos-next-btn");
  const page2Screen   = document.getElementById("page2-screen");

  let index = 0;

  function render(){
    const photo = PHOTOS[index];
    if(!photo) return;

    imgEl.classList.add("fading");
    setTimeout(()=>{
      imgEl.src = photo.src;
      imgEl.alt = photo.caption || "回憶照片";
      imgEl.classList.remove("fading");
    }, 180);

    captionEl.textContent = photo.caption || "";
    counterEl.textContent = `${index+1} / ${PHOTOS.length}`;

    prevZone.classList.toggle("disabled", index === 0);
    nextZone.classList.toggle("disabled", index === PHOTOS.length-1);
  }

  function goPrev(){
    if(index > 0){
      index -= 1;
      render();
    }
  }
  function goNext(){
    if(index < PHOTOS.length-1){
      index += 1;
      render();
    }
  }

  prevZone.addEventListener("click", goPrev);
  nextZone.addEventListener("click", goNext);

  // 電腦使用時，也可以直接按左右鍵切換照片
  document.addEventListener("keydown", (e)=>{
    if(screen.classList.contains("hidden")) return;
    if(e.key === "ArrowLeft") goPrev();
    if(e.key === "ArrowRight") goNext();
  });

  photosNextBtn.addEventListener("click", ()=>{
    screen.classList.add("hidden");
    page2Screen.classList.remove("hidden");
    // 流沙頁依需求保持安靜；30 歲祝福出現時才會換成生日歌。
    BGM.stop();
    // page2 原本是 display:none，這時才有正確的瓶子尺寸可供 canvas 建立。
    // 同時自動開始，使用者不需要在畫面上再點一次。
    requestAnimationFrame(()=>{
      page2Screen.dispatchEvent(new CustomEvent("page2:shown"));
    });
  });

  render();
})();
</script>
